name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'
  DB_PASSWORD: 'titiktemu04!'

jobs:
  # ============================================================
  # PHP TESTS (Pest)
  # ============================================================
  test-php:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: bun run build

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
        run: php artisan migrate --force

      # ============================================================
      # STEP 1: Pest Test Fungsional (KECUALI rate-limit)
      # ============================================================
      - name: Run Pest tests (functional)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 1000
        run: php artisan test --exclude-group=rate-limit

      # ============================================================
      # STEP 2: Pest Test Rate Limiting (HANYA rate-limit)
      # ============================================================
      - name: Run Pest tests (rate limit)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
        run: php artisan test --group=rate-limit

  # ============================================================
  # JAVASCRIPT TESTS (Vitest)
  # ============================================================
  test-js:
    name: JavaScript Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

  # ============================================================
  # E2E TESTS — 3 SHARD (chromium | firefox | webkit)
  #
  # Setiap shard:
  # - Browser berbeda
  # - DB berbeda (titiktemu_db_testing_w{shard})
  # - Port berbeda (8000 + shard)
  # - Jalan PARALEL di runner berbeda
  #
  # TIDAK ADA race condition karena DB terpisah.
  # ============================================================
  test-e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 0
          - browser: firefox
            shard: 1
          - browser: webkit
            shard: 2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile

      - name: Install Playwright Browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: bun run build

      # --------------------------------------------------------
      # Buat database shard (titiktemu_db_testing_w{shard})
      # --------------------------------------------------------
      - name: Create shard database
        env:
          PGPASSWORD: titiktemu04!
        run: |
          psql -h 127.0.0.1 -p 5432 -U titiktemu_dev -d postgres \
            -c "CREATE DATABASE titiktemu_db_testing_w${{ matrix.shard }} OWNER titiktemu_dev;" || true

      # --------------------------------------------------------
      # STEP 1: E2E Fungsional (browser sesuai shard)
      #
      # PENTING: E2E_APP_PORT dan E2E_APP_URL TIDAK di-set.
      # `e2e/config.ts` akan hitung otomatis:
      #   APP_PORT = 8000 + SHARD_INDEX
      #   APP_URL = http://127.0.0.1:{APP_PORT}
      #
      # E2E_DB_DATABASE di-set ke BASE name (tanpa suffix).
      # `e2e/config.ts` akan append `_w{SHARD_INDEX}` karena
      # TOTAL_SHARDS > 1.
      # --------------------------------------------------------
      - name: Run E2E tests (functional)
        env:
          CI: true
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 3
          E2E_DB_CONNECTION: pgsql
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 5432
          E2E_DB_DATABASE: titiktemu_db_testing
          E2E_DB_USERNAME: titiktemu_dev
          E2E_DB_PASSWORD: titiktemu04!
          # AUTH THROTTLE — OVERRIDE LONGGAR
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 1000
          # ✅ CONTACT THROTTLE — OVERRIDE LONGGAR UNTUK E2E
          AUTH_THROTTLE_CONTACT_TEST_OVERRIDE: 1000
        run: bun run test:e2e -- --project=${{ matrix.browser }}

      # --------------------------------------------------------
      # STEP 2: E2E Rate Limit (hanya di shard 0 — chromium)
      # --------------------------------------------------------
      - name: Run E2E tests (rate limit)
        if: matrix.shard == 0
        env:
          CI: true
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 3
          E2E_DB_CONNECTION: pgsql
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 5432
          E2E_DB_DATABASE: titiktemu_db_testing
          E2E_DB_USERNAME: titiktemu_dev
          E2E_DB_PASSWORD: titiktemu04!
          # AUTH THROTTLE — OVERRIDE KETAT UNTUK RATE LIMIT
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 5
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 3
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 3
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 5
          # ✅ CONTACT THROTTLE — OVERRIDE LONGGAR UNTUK E2E
          AUTH_THROTTLE_CONTACT_TEST_OVERRIDE: 1000
        run: bun run test:e2e:rate-limit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # ============================================================
  # CODE QUALITY
  # ============================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run Svelte Check
        run: bun run types:check

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M