name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'
  DB_PASSWORD: 'titiktemu04!'

jobs:
  # ============================================================
  # JOB 1: PHP Tests (Pest)
  # ============================================================
  test-php:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: bun run build

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
        run: php artisan migrate --force

      - name: Run Pest tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
        run: php artisan test

  # ============================================================
  # JOB 2: JavaScript Tests (Vitest)
  # ============================================================
  test-js:
    name: JavaScript Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

  # ============================================================
  # JOB 3: E2E Tests (Playwright) — SHARDED 3x
  # ============================================================
  test-e2e:
    name: E2E (Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # 0-based: konsisten dengan SHARD_INDEX untuk port & DB name
        shard: [0, 1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      SHARD_INDEX: ${{ matrix.shard }}
      TOTAL_SHARDS: 3

      # DB base — akan di-suffix _w{shard} oleh e2e/config.ts
      E2E_DB_CONNECTION: pgsql
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 5432
      E2E_DB_USERNAME: titiktemu_dev
      E2E_DB_PASSWORD: titiktemu04!
      E2E_DB_DATABASE: titiktemu_db_testing

      # Port dinamis: 8000 + shard
      E2E_APP_PORT: ${{ 8000 + matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile

      - name: Install Playwright Browser
        run: bunx playwright install --with-deps

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: bun run build

      # DB shard dibuat otomatis oleh e2e/global-setup.ts
      # (createDatabaseIfNotExists) — tidak perlu step manual.

      - name: Run E2E tests (Shard ${{ matrix.shard }}/3)
        # Playwright --shard 1-based, jadi matrix.shard + 1
        run: bun run test:e2e --shard=${{ matrix.shard + 1 }}/3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ============================================================
  # JOB 4: Code Quality
  # ============================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run Svelte Check
        run: bun run types:check

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress