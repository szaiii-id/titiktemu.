name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'
  DB_PASSWORD: 'titiktemu04!'

jobs:
  test-php:
    name: PHP Tests (Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: bun run build
      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
        run: php artisan migrate --force
      - name: Run Pest tests (functional)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 1000
        run: php artisan test --exclude-group=rate-limit
      - name: Run Pest tests (rate limit)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: titiktemu_db_testing
          DB_USERNAME: titiktemu_dev
          DB_PASSWORD: titiktemu04!
        run: php artisan test --group=rate-limit

  test-js:
    name: JavaScript Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: bun run test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

  test-e2e-functional:
    name: E2E Functional (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 0
            playwright_shard: 1
            timeout: 30
          - browser: firefox
            shard: 1
            playwright_shard: 2
            timeout: 30
          - browser: webkit
            shard: 2
            playwright_shard: 3
            timeout: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile
      - name: Install Playwright Browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Build frontend assets
        run: bun run build
      - name: Create shard database
        env:
          PGPASSWORD: titiktemu04!
        run: |
          psql -h 127.0.0.1 -p 5432 -U titiktemu_dev -d postgres \
            -c "CREATE DATABASE titiktemu_db_testing_w${{ matrix.shard }} OWNER titiktemu_dev;" || true
      - name: Run E2E tests (functional)
        env:
          CI: true
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 3
          E2E_DB_CONNECTION: pgsql
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 5432
          E2E_DB_DATABASE: titiktemu_db_testing
          E2E_DB_USERNAME: titiktemu_dev
          E2E_DB_PASSWORD: titiktemu04!
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 1000
          AUTH_THROTTLE_CONTACT_TEST_OVERRIDE: 1000
        run: bun run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.playwright_shard }}/3
      - name: Upload Playwright report
        # if: always()
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-functional-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-functional-${{ matrix.browser }}
          path: test-results/
          retention-days: 1

  test-e2e-rate-limit:
    name: E2E Rate Limit (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 0
            playwright_shard: 1
          - browser: firefox
            shard: 1
            playwright_shard: 2
          - browser: webkit
            shard: 2
            playwright_shard: 3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: titiktemu_db_testing
          POSTGRES_USER: titiktemu_dev
          POSTGRES_PASSWORD: titiktemu04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile
      - name: Install Playwright Browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Build frontend assets
        run: bun run build
      - name: Create rate-limit shard database
        env:
          PGPASSWORD: titiktemu04!
        run: |
          psql -h 127.0.0.1 -p 5432 -U titiktemu_dev -d postgres \
            -c "CREATE DATABASE titiktemu_db_testing_rl_w${{ matrix.shard }} OWNER titiktemu_dev;" || true
      - name: Run E2E tests (rate limit)
        env:
          CI: true
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 3
          E2E_DB_CONNECTION: pgsql
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 5432
          E2E_DB_DATABASE: titiktemu_db_testing_rl
          E2E_DB_USERNAME: titiktemu_dev
          E2E_DB_PASSWORD: titiktemu04!
          AUTH_THROTTLE_LOGIN_MAX: 5
          AUTH_THROTTLE_LOGIN_DECAY: 60
          AUTH_THROTTLE_LOGIN_TEST_OVERRIDE: 5
          AUTH_THROTTLE_REGISTER_MAX: 3
          AUTH_THROTTLE_REGISTER_DECAY: 60
          AUTH_THROTTLE_REGISTER_TEST_OVERRIDE: 3
          AUTH_THROTTLE_FORGOT_MAX: 3
          AUTH_THROTTLE_FORGOT_DECAY: 60
          AUTH_THROTTLE_FORGOT_PASSWORD_TEST_OVERRIDE: 3
          AUTH_THROTTLE_RESET_MAX: 5
          AUTH_THROTTLE_RESET_DECAY: 60
          AUTH_THROTTLE_RESET_PASSWORD_TEST_OVERRIDE: 5
          AUTH_THROTTLE_CONTACT_TEST_OVERRIDE: 1000
        run: bun run test:e2e:rate-limit -- --project=${{ matrix.browser }} --shard=${{ matrix.playwright_shard }}/3
      - name: Upload Playwright report
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rate-limit-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rate-limit-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, pdo_pgsql, gd, zip, intl
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: bun install --frozen-lockfile
      - name: Run Pint
        run: ./vendor/bin/pint --test
      - name: Run Svelte Check
        run: bun run types:check
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M
