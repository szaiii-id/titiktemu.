name: titiktemu

services:
    pgsql:
        image: postgres:16
        container_name: titiktemu_pgsql
        ports:
            - '${DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - titiktemu_pg_data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d
        restart: 'no'

volumes:
    titiktemu_pg_data:
        driver: local